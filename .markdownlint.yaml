---
# markdownlint configuration, also consumed by Codacy's markdownlint engine when
# the repository is set to use its own configuration files.
#
# Scope note: this file overrides one rule only, MD024. No other rule is
# restated or disabled.
#
# Fleet baseline (A34): every repo with a CHANGELOG.md carries this MD024
# override, worded identically, so Codacy's markdownlint engine does not fail
# on the Keep a Changelog format. See fastapi-m8's `.markdownlint.yaml` for the
# canonical rationale text this is copied from, and
# `.workspace/context/markdown-conventions.md` for the fleet-wide format and
# heading-form decisions this file follows.

# MD024/no-duplicate-heading — restrict to sibling headings.
#
# CHANGELOG.md follows Keep a Changelog, where every release section repeats the
# same subsection names (### Added / ### Changed / ### Fixed …). Under the
# default setting that makes each release after the first a stack of
# duplicate-heading errors, purely as a function of how many releases the file
# records. The duplication is the format, not a defect, and renaming the
# sections to be unique would break the convention every reader relies on.
#
# siblings_only flags a duplicate only when it shares a parent heading, so
# "### Added" under two different `## [x.y.z]` releases both pass, while two
# "### Added" blocks inside one release — a real editing mistake — still fail.
MD024:
  siblings_only: true
